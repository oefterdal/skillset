name: release
on:
  push:
    tags: ["v*"]
jobs:
  create-release:
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - run: gh release create "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: bun-linux-x64
            artifact: skillset-linux-x64
          - os: ubuntu-24.04
            target: bun-linux-arm64
            artifact: skillset-linux-arm64
          - os: macos-13
            target: bun-darwin-x64
            artifact: skillset-darwin-x64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: skillset-darwin-arm64
    runs-on: ${{ matrix.os }}
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun build src/cli.ts --compile --target=${{ matrix.target }} --outfile ${{ matrix.artifact }}
      - run: shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
      - run: gh release upload "${GITHUB_REF_NAME}" "${{ matrix.artifact }}" "${{ matrix.artifact }}.sha256"
        env:
          GH_TOKEN: ${{ github.token }}
